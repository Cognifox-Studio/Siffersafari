name: Release Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/release-guard.yml'

jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 / AGP 8.11 cannot run on the JDK 25 that ubuntu-latest now
      # ships with; the build fails with a bare "25.0.5" message. Pin the same
      # JDK as ci.yaml and build.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # `flutter analyze` is owned by ci.yaml; keep this job focused on the
      # release-specific checks so a PR does not analyze four times.
      - name: Fast release checks
        run: |
          flutter test test/unit/logic/spaced_repetition_test.dart
          flutter test test/unit/logic/quiz_provider_srs_test.dart
          flutter test test/unit/audits/question_bank_runtime_status_audit_test.dart

      # No keystore in PR context: this build exists only to measure AAB size, so
      # it explicitly opts in to debug signing. Without this env var the Gradle
      # config refuses to produce a release artifact (see android/app/build.gradle.kts).
      - name: Build release App Bundle
        env:
          SIFFERSAFARI_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
        run: flutter build appbundle --release

      - name: Verify AAB size budget
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          SIZE_BYTES=$(stat -c%s "$AAB_PATH")
          MAX_BYTES=$((80 * 1024 * 1024))
          echo "AAB size: $SIZE_BYTES bytes"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "AAB exceeds budget ($MAX_BYTES bytes)"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
