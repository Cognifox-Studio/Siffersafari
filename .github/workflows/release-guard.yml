name: Release Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/release-guard.yml'

jobs:
  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Fast release checks
        run: |
          flutter analyze --fatal-infos lib test
          flutter test test/unit/logic/spaced_repetition_test.dart
          flutter test test/unit/logic/quiz_provider_srs_test.dart
          flutter test test/unit/audits/question_bank_runtime_status_audit_test.dart

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Verify AAB size budget
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB_PATH"
          SIZE_BYTES=$(stat -c%s "$AAB_PATH")
          MAX_BYTES=$((80 * 1024 * 1024))
          echo "AAB size: $SIZE_BYTES bytes"
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "AAB exceeds budget ($MAX_BYTES bytes)"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
