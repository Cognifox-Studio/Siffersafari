name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build generated files (Hive/Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter analyze` is owned by ci.yaml so it runs exactly once per change.
      - name: Run tests
        continue-on-error: true
        run: flutter test test --reporter expanded 2>&1 | tee /tmp/test.log

      - name: Show failures
        if: always()
        run: |
          echo "--- [E] lines ---"
          grep -n "\[E\]" /tmp/test.log | head -20 || true
          echo "--- context ---"
          grep -n -A 30 "\[E\]" /tmp/test.log | head -150 || true
          echo "--- expected ---"
          grep -n -A 12 "Expected:" /tmp/test.log | head -80 || true
