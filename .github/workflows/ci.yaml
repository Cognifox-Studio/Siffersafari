name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
      - run: flutter pub get
      - run: flutter analyze --fatal-infos lib test integration_test
      - name: Question bank runtime audit
        run: flutter test test/unit/audits/question_bank_runtime_status_audit_test.dart

  core-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Run core smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -o pipefail
            flutter test integration_test/app_smoke_test.dart -d emulator-${EMULATOR_PORT} --dart-define=FULL_SMOKE=false --plain-name "Smoke: app startar och hittar huvudskärm" 2>&1 | tee core_smoke.log
            exit ${PIPESTATUS[0]}
      - name: Upload core smoke log
        uses: actions/upload-artifact@v4
        with:
          name: core-smoke-log
          path: core_smoke.log
      - name: Add summary
        run: |
          echo '### Core smoke test körd på PR' >> $GITHUB_STEP_SUMMARY
          tail -n 20 core_smoke.log >> $GITHUB_STEP_SUMMARY

  full-smoke-and-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Run full smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -o pipefail
            flutter test integration_test/app_smoke_test.dart -d emulator-${EMULATOR_PORT} --dart-define=FULL_SMOKE=true 2>&1 | tee full_smoke.log
            exit ${PIPESTATUS[0]}
      - name: Upload full smoke log
        uses: actions/upload-artifact@v4
        with:
          name: full-smoke-log
          path: full_smoke.log
      - name: Run audit test
        run: |
          set -o pipefail
          flutter test test/unit/audits/difficulty_mix_audit_test.dart 2>&1 | tee audit.log
      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: audit-log
          path: audit.log
      - name: Add summary
        run: |
          echo '### Full smoke och audit körda på push' >> $GITHUB_STEP_SUMMARY
          tail -n 20 full_smoke.log >> $GITHUB_STEP_SUMMARY
          tail -n 20 audit.log >> $GITHUB_STEP_SUMMARY
